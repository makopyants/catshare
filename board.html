  /* пергаментные листы, прибитые к доске */
  .sheet {

    box-shadow:

  .nail {
    position: absolute;
    width: 12px; height: 12px;

    background: radial-gradient(circle at 38% 32%, #5d4a38 0%, #3a2b1e 45%, #241811 100%);

  }

  /* шапка-лист */
  .head-sheet { text-align: center; padding: 14px 18px 16px; margin-bottom: 22px; }
  .medallion {
    width: 74px; height: 74px;
    border-radius: 50%;
    display: block;
    margin: 0 auto 2px;
    mix-blend-mode: multiply;
  }
  h1 { font-size: clamp(1.4rem, 4.4vw, 2.2rem); }
  .intro { color: var(--ink-soft); font-size: .98rem; max-width: 760px; margin: 6px auto 0; }
  .lang-switch {
    position: absolute;
    top: 12px; right: 14px;
    display: flex; gap: 4px;
    background: linear-gradient(rgba(20, 10, 5, .4), rgba(20, 10, 5, .4)), url("wood.jpg") #3a2412;
    background-size: auto, 300px auto;
    border-radius: 999px;
    padding: 3px;
    z-index: 5;
  }
  .lang-switch button {
    border: none; background: none;
    color: #d8c39a;
    font-size: .92rem;
    padding: 3px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .lang-switch button.active {
    background: url("parchment.jpg") var(--parch);
    background-size: 300px auto;
    color: var(--ink);
  }

  /* три карточки */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 26px;
    align-items: start;
  }
  .card { padding: 12px 14px 18px; }
  .card:nth-child(1) { transform: rotate(-1.1deg); }
  .card:nth-child(2) { transform: rotate(.7deg); }
  .card:nth-child(3) { transform: rotate(-.5deg); }
  .card h2 {
    text-align: center;
    color: var(--blood);
    font-size: 1.45rem;
    margin: 4px 0 10px;
  }
  .card .desc { font-size: .96rem; margin-top: 12px; }

  .mini {

    aspect-ratio: 3 / 4;
    border: 1px solid #150b06;
    border-radius: 6px;
    overflow: hidden;
    padding: 8px;
    background:
      linear-gradient(rgba(15, 8, 4, .30), rgba(15, 8, 4, .30)),

    background-size: auto, 600px auto;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .4), inset 0 0 10px rgba(0, 0, 0, .5);
  }
  .mini .track {
    display: flex;
    height: 100%;
    background: #171310;
    border-radius: 3px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .mini .track::-webkit-scrollbar { display: none; }
  .mini .slide {
    flex: 0 0 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;

    position: absolute; inset: -8%;
    width: 116%; height: 116%;
    object-fit: cover;
    filter: blur(16px) brightness(.55);
  }

    position: relative; z-index: 1;
    max-width: 100%; max-height: 100%;
    object-fit: contain;
  }
  .mini .nav {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: 34px; height: 34px;
    border: 1px solid rgba(59, 38, 23, .6);
    border-radius: 50%;
    background: rgba(236, 217, 179, .82);

  .mini .prev { left: 14px; }
  .mini .next { right: 14px; }
  .counter {
    position: absolute; top: 14px; right: 16px;
    z-index: 5;
    background: rgba(34, 20, 9, .78);
    color: var(--parch);
    font-size: .85rem;

    width: 50px; height: 50px;
    border-radius: 50%;
  }
  .lightbox .lprev { left: 14px; }
  .lightbox .lnext { right: 14px; }
</style>

function iconSvg(name) {
  return `<svg class="s-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${ICONS[name]}"/></svg>`;
}

/* ============ карточки ============ */
const cardsBox = document.getElementById("cards");
const minis = []; // {track, counter, files}

KITTENS.forEach((k, ki) => {
  const card = document.createElement("div");
  card.className = "sheet card";
  card.innerHTML = `
    <i class="nail" style="top:7px;left:10px"></i><i class="nail" style="top:7px;right:10px"></i>
    <h2 data-i18n="${k.key}title"></h2>
    <div class="mini">
      <div class="track"></div>
      <button class="nav prev">‹</button>
      <button class="nav next">›</button>
      <div class="counter"></div>
    </div>
    <p class="desc" data-i18n="${k.key}text"></p>`;
  cardsBox.appendChild(card);

  const track = card.querySelector(".track");
  const counter = card.querySelector(".counter");
  k.files.forEach((name, i) => {
    const slide = document.createElement("div");
    slide.className = "slide";
    const src = `${MEDIA_DIR}/${encodeURIComponent(name)}`;
    const bg = document.createElement("img");
    bg.src = src; bg.className = "bg"; bg.loading = "lazy"; bg.setAttribute("aria-hidden", "true");
    const img = document.createElement("img");
    img.src = src; img.className = "main"; img.loading = i === 0 ? "eager" : "lazy"; img.alt = "";
    slide.append(bg, img);
    slide.addEventListener("click", () => openLightbox(ki, i));
    track.appendChild(slide);
  });
  const mini = { track, counter, files: k.files, current: 0 };
  minis.push(mini);

  const update = () => { counter.textContent = `${mini.current + 1} / ${k.files.length}`; };
  update();
  track.addEventListener("scroll", () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== mini.current && i >= 0 && i < k.files.length) { mini.current = i; update(); }
  }, { passive: true });
  const go = d => {
    mini.current = (mini.current + d + k.files.length) % k.files.length;
    track.scrollTo({ left: mini.current * track.clientWidth, behavior: "smooth" });
    update();
  };
  card.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); go(-1); });
  card.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); go(1); });
});

/* ============ лайтбокс ============ */
const lightbox = document.getElementById("lightbox");
const lightboxContent = document.getElementById("lightboxContent");
let lbKitten = 0, lbIndex = 0;

function openLightbox(ki, i) {
  lbKitten = ki; lbIndex = i;
  renderLb();
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
}
function renderLb() {
  const name = KITTENS[lbKitten].files[lbIndex];
  lightboxContent.innerHTML = `<img src="${MEDIA_DIR}/${encodeURIComponent(name)}">`;
}
function closeLb() {
  lightbox.classList.remove("open");
  lightboxContent.innerHTML = "";
  document.body.style.overflow = "";
}
function lbStep(d) {
  const n = KITTENS[lbKitten].files.length;
  lbIndex = (lbIndex + d + n) % n;
  renderLb();
}
lightbox.querySelector(".close").addEventListener("click", closeLb);
lightbox.querySelector(".lprev").addEventListener("click", e => { e.stopPropagation(); lbStep(-1); });
lightbox.querySelector(".lnext").addEventListener("click", e => { e.stopPropagation(); lbStep(1); });
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLb(); });
document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") lbStep(-1);
  if (e.key === "ArrowRight") lbStep(1);
});

/* ============ контакты и шеринг ============ */
function renderContacts() {
  const box = document.getElementById("contactButtons");
  const add = (href, icon, label) => {
    const a = document.createElement("a");
    a.href = href;
    a.innerHTML = iconSvg(icon) + " " + label;
    a.target = "_blank";
    a.rel = "noopener";
    box.appendChild(a);
  };
  add(`https://t.me/${CONTACTS.telegram}`, "telegram", "Telegram");
  add(`https://wa.me/${CONTACTS.whatsapp}`, "whatsapp", "WhatsApp");
  add(`viber://chat?number=${encodeURIComponent(CONTACTS.viber)}`, "viber", "Viber");
  add(`tel:${CONTACTS.phone}`, "phone", CONTACTS.phone.replace(/(\+381)(\d{2})(\d{4})(\d{3})/, "$1 $2 $3 $4"));
}
function renderShare() {
  const box = document.getElementById("shareButtons");
  const mk = (icon, label, fn) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = iconSvg(icon) + " " + label;
    b.addEventListener("click", fn);
    box.appendChild(b);
  };
  mk("telegram", "Telegram", () =>
    window.open(`https://t.me/share/url?url=${encodeURIComponent(SHARE_URL)}&text=${encodeURIComponent(I18N[lang].shareText)}`, "_blank", "noopener"));
  mk("whatsapp", "WhatsApp", () =>
    window.open(`https://wa.me/?text=${encodeURIComponent(I18N[lang].shareText + "\n\n" + SHARE_URL)}`, "_blank", "noopener"));
  mk("threads", "Threads", () =>
    window.open(`https://www.threads.net/intent/post?text=${encodeURIComponent(I18N[lang].shareText + "\n\n" + SHARE_URL)}`, "_blank", "noopener"));
}

/* ============ язык ============ */
function setLang(l) {
  lang = l;
  document.documentElement.lang = lang;
  document.title = I18N[lang].title;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const t = I18N[lang][el.dataset.i18n];
    if (t !== undefined) el.textContent = t;
  });
  document.querySelectorAll("#langSwitch button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang));
  try { localStorage.setItem("lang", lang); } catch (e) {}
}
document.querySelectorAll("#langSwitch button").forEach(b =>
  b.addEventListener("click", () => setLang(b.dataset.lang)));

let savedLang = null;
try { savedLang = localStorage.getItem("lang"); } catch (e) {}
const browserSr = (navigator.languages || [navigator.language || ""]).some(l => /^(sr|hr|bs)/i.test(l));

renderContacts();
renderShare();
setLang(savedLang || (browserSr ? "sr" : "ru"));
</script>
